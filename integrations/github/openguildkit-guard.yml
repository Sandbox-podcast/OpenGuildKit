# Copy to .github/workflows/openguildkit-guard.yml in a project that uses OpenGuildKit.
# It checks that a pull request carries a decision exported with `openguildkit task export ID`
# and approved under the rules of the base revision: the guard mode, the profile, the catalog
# lock and the allowed signers are read from the base commit, so the pull request cannot weaken
# them. With "guard": "observe" on the base it only reports; with "guard": "enforce" a pull
# request without a valid decision fails. Each record's seal is recomputed and, when the base
# profile requires signed approvals, its signature is verified. Each changed file must be listed
# by a record the pull request brings. fetch-depth: 0 keeps the base commit available.
# A pull request runs its own copy of this file: list .github/workflows/ in CODEOWNERS with a
# required review, or require this workflow from the default branch with a ruleset
# (integrations/README.md#protect-the-check). With local approvals, add --require-signed to the
# last step to fail until approvals are signed.
name: OpenGuildKit guard

on:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 2026-07-20 v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A project whose catalog lock names an organization catalog (openguildkit org-catalog show) needs its copy
      # here: uncomment this step, set the repository, then pass the folder to the last step with
      # --org-catalog NAME=$GITHUB_WORKSPACE/org-catalog. OpenGuildKit reads the commit the lock pins and fetches nothing.
      # - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 2026-07-20 v7.0.1
      #   with:
      #     repository: your-organization/org-catalog
      #     path: org-catalog
      #     fetch-depth: 0
      #     persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # 2026-10-22 v7.1.0
        with:
          python-version: "3.13"
      - name: Install OpenGuildKit
        # Set the release your project uses and the wheel's hash from that release's SHA256SUMS.txt
        # (docs/install.md). The step fails until the hash matches the downloaded wheel.
        env:
          OPENGUILDKIT_TAG: v0.17.0
          OPENGUILDKIT_WHEEL: openguildkit-0.17.0-py3-none-any.whl
          OPENGUILDKIT_WHEEL_SHA256: replace-with-the-wheel-hash-from-SHA256SUMS.txt
        run: |
          curl -fsSL -o "$RUNNER_TEMP/$OPENGUILDKIT_WHEEL" \
            "https://github.com/Sandbox-podcast/OpenGuildKit/releases/download/$OPENGUILDKIT_TAG/$OPENGUILDKIT_WHEEL"
          printf '%s  %s\n' "$OPENGUILDKIT_WHEEL_SHA256" "$RUNNER_TEMP/$OPENGUILDKIT_WHEEL" | sha256sum --strict -c -
          python -m pip install "$RUNNER_TEMP/$OPENGUILDKIT_WHEEL"
      - name: Check the decision behind the changes
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: openguildkit guard --ci --base "$BASE_REF"
