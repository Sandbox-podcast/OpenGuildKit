# Copy to .github/workflows/openguildkit-guard.yml in a project that uses OpenGuildKit.
# It checks that a pull request carries a decision exported with `openguildkit task export ID`
# and approved under the project's current rules. With "guard": "observe" in the profile it
# only reports; with "guard": "enforce" a pull request without a valid decision fails.
name: OpenGuildKit guard

on:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install OpenGuildKit
        # Set the release your project uses and the wheel's hash from that release's SHA256SUMS.txt
        # (docs/install.md). The step fails until the hash matches the downloaded wheel.
        env:
          OPENGUILDKIT_TAG: v0.16.1
          OPENGUILDKIT_WHEEL: openguildkit-0.16.1-py3-none-any.whl
          OPENGUILDKIT_WHEEL_SHA256: replace-with-the-wheel-hash-from-SHA256SUMS.txt
        run: |
          curl -fsSL -o "$RUNNER_TEMP/$OPENGUILDKIT_WHEEL" \
            "https://github.com/Sandbox-podcast/OpenGuildKit/releases/download/$OPENGUILDKIT_TAG/$OPENGUILDKIT_WHEEL"
          printf '%s  %s\n' "$OPENGUILDKIT_WHEEL_SHA256" "$RUNNER_TEMP/$OPENGUILDKIT_WHEEL" | sha256sum --strict -c -
          python -m pip install "$RUNNER_TEMP/$OPENGUILDKIT_WHEEL"
      - name: Check the decision behind the changes
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: openguildkit guard --ci --base "$BASE_REF"
