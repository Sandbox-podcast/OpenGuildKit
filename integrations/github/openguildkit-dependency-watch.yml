# Copy to .github/workflows/openguildkit-dependency-watch.yml in a project that uses OpenGuildKit.
# Every Monday it runs the project's scanner and imports the report into the alert register
# (.openguildkit/alerts.json). For each confirmed alert that no task handles yet, it opens a task: the register
# links the alert to the task's ID and an issue tracks it. It then proposes the updated register in a pull request
# (branch openguildkit/dependency-watch-RUN-ATTEMPT), where a person confirms or dismisses the new alerts before merging.
# The job changes no dependency: a fix goes through an OpenGuildKit task and its approval.
# The repository setting "Allow GitHub Actions to create and approve pull requests" must be on for the pull request.
#
# In guard mode enforce, guard --ci refuses the pull request until it carries an exported decision that lists
# .openguildkit/alerts.json: the register decides what blocks an approval, so it changes under a task like any
# other work. The person who reviews the alerts opens a review task on the base branch and gets it approved, then
# checks out the pull request's branch, reviews the alerts, commits the register and exports the decision there
# (docs/alerts.md, "The pull request and the guard"). GitHub leaves the pull_request runs of a pull request opened
# with the job's GITHUB_TOKEN waiting for a maintainer's approval: the reviewer's push starts them, or a maintainer
# approves them in the pull request.
name: OpenGuildKit dependency watch

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

# Each job asks for what it needs.
permissions: {}

jobs:
  # A scanner such as pip-audit installs the dependencies it audits ("functionally equivalent to
  # pip install -r", its README says): their code runs here, in a job whose token can only read the repository.
  # The report goes to the next job as an artifact; no dependency is installed where the token can write.
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Run the scanner
        # Use the scanner your project already approves and pin its version, for example
        # `npm audit --json > report.json` or `osv-scanner --format json -r . > report.json`.
        # A scanner exits with an error code when it finds vulnerabilities; the report is what counts.
        run: |
          python -m pip install "pip-audit==2.7.3"
          pip-audit -r requirements.txt -f json -o report.json || test -s report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-report
          path: report.json
          if-no-files-found: error
          retention-days: 1

  # Installs only OpenGuildKit, from a release checked by its hash, and reads the report of the scan job.
  watch:
    needs: scan
    concurrency: openguildkit-dependency-watch-${{ github.ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install OpenGuildKit
        # Set the release your project uses and the wheel's hash from that release's SHA256SUMS.txt
        # (docs/install.md). The step fails until the hash matches the downloaded wheel.
        env:
          OPENGUILDKIT_TAG: v0.17.0
          OPENGUILDKIT_WHEEL: openguildkit-0.17.0-py3-none-any.whl
          OPENGUILDKIT_WHEEL_SHA256: replace-with-the-wheel-hash-from-SHA256SUMS.txt
        run: |
          curl -fsSL -o "$RUNNER_TEMP/$OPENGUILDKIT_WHEEL" \
            "https://github.com/Sandbox-podcast/OpenGuildKit/releases/download/$OPENGUILDKIT_TAG/$OPENGUILDKIT_WHEEL"
          printf '%s  %s\n' "$OPENGUILDKIT_WHEEL_SHA256" "$RUNNER_TEMP/$OPENGUILDKIT_WHEEL" | sha256sum --strict -c -
          python -m pip install "$RUNNER_TEMP/$OPENGUILDKIT_WHEEL"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-report
          path: .
      - name: Import the report into the alert register
        # With several reports of one scanner, such as npm audit in front/ and in admin/, have the scan job write one
        # file per lockfile and import each with its own scope, for example
        # `openguildkit alerts import front.json --scope front --json > changes-front.json`: without --scope, a report
        # resolves the alerts that the scanner's other reports listed (docs/alerts.md, "One report per scanner, or
        # one scope per report").
        run: |
          openguildkit alerts import report.json --json > changes.json
          {
            echo "## Dependency alerts"
            echo
            jq -r 'if .nothing_analyzed then "The report analyzed no dependency (\(.nothing_analyzed)): it resolves no alert.\n" else empty end' changes.json
            echo "New or reopened alerts to review in the pull request (confirm or dismiss each one):"
            jq -r '(.new + .reopened)[] | "- " + .' changes.json
            echo
            echo "Resolved:"
            jq -r '.resolved[] | "- " + .' changes.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Open a task per new confirmed alert
        # The task ID is the same in every run and every copy: the register links the alert to it, so the alert
        # leaves the list of alerts without a task, and whoever takes the task creates it with that ID.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          openguildkit alerts tasks --open --json > opened.json
          known_titles=$(gh issue list --state all --limit 500 --json title --jq '.[].title')
          jq -c '.[]' opened.json | while read -r item; do
            task=$(jq -r '.task' <<<"$item")
            title="OpenGuildKit task $task: dependency alert $(jq -r '.alert' <<<"$item")"
            if grep -Fxq -- "$title" <<<"$known_titles"; then
              echo "Already opened: $title"
              continue
            fi
            body=$(jq -r '"\(.brief)\n\nThe alert register links the alert to task \(.task) in the pull request of this run. Open the task in your copy with that ID, then consult the boards:\n\n    openguildkit task new \"\(.brief)\" --id \(.task)\n    openguildkit task consult \(.task)\n\nA confirmed critical alert blocks the approval and the completion of its task until a report shows it resolved or a person records why it is accepted."' <<<"$item")
            gh issue create --title "$title" --body "$body"
          done
      - name: Propose the register in a pull request
        # The register goes through the GitHub API with the job's token, which never reaches .git/config.
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
        run: |
          register=.openguildkit/alerts.json
          if git ls-files --error-unmatch "$register" >/dev/null 2>&1 && git diff --quiet HEAD -- "$register"; then
            echo "The alert register did not change: no pull request."
            exit 0
          fi
          pending=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls" -X GET -f state=open -f base="$BASE" -F per_page=100 \
            --jq '.[] | select(.head.repo.full_name == .base.repo.full_name) | select(.head.ref == "openguildkit/dependency-watch" or (.head.ref | startswith("openguildkit/dependency-watch-"))) | .number')
          if [ -n "$pending" ]; then
            echo "A dependency watch pull request is awaiting merge: $pending. Its branch is left untouched."
            exit 0
          fi
          branch="openguildkit/dependency-watch-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          head=$(git rev-parse HEAD)
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$branch" -f sha="$head" >/dev/null
          current=$(gh api "repos/$GITHUB_REPOSITORY/contents/$register?ref=$branch" --jq .sha 2>/dev/null || true)
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$register" -f branch="$branch" \
            -f message="Update the dependency alert register" -f content="$(base64 < "$register" | tr -d '\n')" \
            ${current:+-f sha="$current"} >/dev/null
          {
            echo "The weekly dependency watch updated the alert register ($(jq -r '.tool' changes.json), $(jq -r '.analyzed' changes.json) dependencies analyzed)."
            echo
            echo "New or reopened alerts to review:"
            jq -r '(.new + .reopened)[] | "- `" + . + "`"' changes.json
            echo
            echo "Resolved by the report:"
            jq -r '.resolved[] | "- `" + . + "`"' changes.json
            echo
            echo "Tasks opened for confirmed alerts:"
            jq -r '.[] | "- `" + .task + "` for `" + .alert + "`"' opened.json
            echo
            echo "Review each new alert on this branch before merging: \`openguildkit alerts set ALERT --status confirmed --by NAME\`, or \`--status dismissed --by NAME --reason WHY\` (dismissing a critical alert needs the person at a terminal), then commit \`.openguildkit/alerts.json\`. The next run opens a task for each confirmed alert."
          } > body.md
          gh pr create --head "$branch" --base "$BASE" --title "Dependency alerts: review the register" --body-file body.md
