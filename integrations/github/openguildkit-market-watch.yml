# Copy to .github/workflows/openguildkit-market-watch.yml in a project that keeps market dossiers
# in .openguildkit/market/. Every Monday it runs `openguildkit market due --all` and opens one issue
# per watched competitor source whose review is due, unless an open issue already has that title.
# The job only lists sources: it opens no competitor page. A person, or the market-analyst agent
# under the project's research policy, reviews each source and records the result with
# `openguildkit market checked` or `openguildkit market change`; under local-only, a person records it
# with `openguildkit market provided --by INITIALS`, which the issue says.
name: OpenGuildKit market watch

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  due:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 2026-07-20 v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # 2026-10-22 v7.1.0
        with:
          python-version: "3.13"
      - name: Install OpenGuildKit
        # Set the release your project uses and the wheel's hash from that release's SHA256SUMS.txt
        # (docs/install.md). The step fails until the hash matches the downloaded wheel.
        env:
          OPENGUILDKIT_TAG: v0.17.0
          OPENGUILDKIT_WHEEL: openguildkit-0.17.0-py3-none-any.whl
          OPENGUILDKIT_WHEEL_SHA256: replace-with-the-wheel-hash-from-SHA256SUMS.txt
        run: |
          curl -fsSL -o "$RUNNER_TEMP/$OPENGUILDKIT_WHEEL" \
            "https://github.com/Sandbox-podcast/OpenGuildKit/releases/download/$OPENGUILDKIT_TAG/$OPENGUILDKIT_WHEEL"
          printf '%s  %s\n' "$OPENGUILDKIT_WHEEL_SHA256" "$RUNNER_TEMP/$OPENGUILDKIT_WHEEL" | sha256sum --strict -c -
          python -m pip install "$RUNNER_TEMP/$OPENGUILDKIT_WHEEL"
      - name: List the sources due for review
        run: openguildkit market due --all --json > due.json
      - name: Open an issue per source to review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open_titles=$(gh issue list --state open --limit 500 --json title --jq '.[].title')
          jq -c '.due[]' due.json | while read -r item; do
            title=$(jq -r '.issue.title' <<<"$item")
            if grep -Fxq -- "$title" <<<"$open_titles"; then
              echo "Already open: $title"
              continue
            fi
            gh issue create --title "$title" --body "$(jq -r '.issue.body' <<<"$item")"
          done
