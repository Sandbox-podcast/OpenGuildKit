name: OpenGuildKit required pilot

on:
  pull_request_target:
    branches: [pilot/merge-gate-base]
    types: [opened, synchronize, reopened]
  # A waiver expires and a rule changes without any push to the PR. GitHub runs schedules from the default branch.
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        type: string
        description: PR to evaluate. Without a PR or a commit, every open PR is evaluated again.
        required: false
      commit:
        type: string
        required: false

permissions: {}

jobs:
  targets:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/pilot/merge-gate-base'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pull-requests: read
    outputs:
      pulls: ${{ steps.list.outputs.pulls }}
    env:
      GH_TOKEN: ${{ github.token }}
      EVENT_PR: ${{ github.event.pull_request.number || inputs.pr }}
      EVENT_HEAD: ${{ github.event.pull_request.head.sha || inputs.commit }}
      EXPECTED_BASE: pilot/merge-gate-base
    steps:
      - name: List the pull requests to evaluate
        id: list
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$EVENT_PR" || -n "$EVENT_HEAD" ]]; then
            [[ "$EVENT_PR" =~ ^[1-9][0-9]*$ && "$EVENT_HEAD" =~ ^[a-f0-9]{40}$ ]]
            pulls=$(jq -cn --argjson pr "$EVENT_PR" --arg head "$EVENT_HEAD" '[{pr: $pr, head: $head}]')
          else
            pulls=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls?state=open&base=$EXPECTED_BASE&per_page=100" |
              jq -c 'add // [] | map({pr: .number, head: .head.sha})')
          fi
          printf 'pulls=%s\n' "$pulls" >> "$GITHUB_OUTPUT"

  required:
    needs: targets
    if: needs.targets.outputs.pulls != '[]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.pulls) }}
    concurrency:
      group: openguildkit-required-${{ matrix.pr }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ matrix.pr }}
      EXPECTED_HEAD: ${{ matrix.head }}
      EXPECTED_BASE: pilot/merge-gate-base
      STATUS_CONTEXT: openguildkit/required-pilot
      PROFILE_MAINTAINER: ${{ vars.OPENGUILDKIT_PROFILE_MAINTAINER }}
    steps:
      # Branch protection requires this context from this application only. A status from GITHUB_TOKEN does not count.
      - name: Authenticate the status application
        id: status-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.OPENGUILDKIT_STATUS_APP_CLIENT_ID }}
          private-key: ${{ secrets.OPENGUILDKIT_STATUS_APP_PRIVATE_KEY }}
          permission-statuses: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || 'refs/heads/pilot/merge-gate-base' }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check the PR identity
        id: identity
        env:
          STATUS_TOKEN: ${{ steps.status-token.outputs.token }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ && "$EXPECTED_HEAD" =~ ^[a-f0-9]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" |
            jq -e --arg base "$EXPECTED_BASE" --arg head "$EXPECTED_HEAD" '.state == "open" and .base.ref == $base and .head.sha == $head' >/dev/null
          if [[ "$EVENT_NAME" != schedule ]]; then
            GH_TOKEN="$STATUS_TOKEN" gh api "repos/$GITHUB_REPOSITORY/statuses/$EXPECTED_HEAD" -f context="$STATUS_CONTEXT" -f state=pending -f description='OpenGuildKit is checking the current commit'
          fi
      - name: Install and run the required gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$PROFILE_MAINTAINER" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$ ]]; then
            echo '::error::Set the OPENGUILDKIT_PROFILE_MAINTAINER variable to the GitHub login that merges profile proposals.'
            exit 1
          fi
          read -r digest asset < pilot/required-kit.sha256
          [[ "$digest" =~ ^[a-f0-9]{64}$ && "$asset" =~ ^openguildkit-([0-9]+\.[0-9]+\.[0-9]+)\.tgz$ ]]
          release="v${BASH_REMATCH[1]}"
          mkdir -p proof "$RUNNER_TEMP/ogk-kit"
          (
            cd "$RUNNER_TEMP/ogk-kit"
            gh release download "$release" -R "$GITHUB_REPOSITORY" -p "$asset"
            sha256sum -c "$GITHUB_WORKSPACE/pilot/required-kit.sha256"
            tar -xf "$asset"
          )
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg ref "refs/heads/$EXPECTED_BASE" --argjson pr "$PR_NUMBER" \
            --arg maintainer "$PROFILE_MAINTAINER" \
            '{policyRepo:{id:$repo,path:".",ref:$ref},projects:[{id:$repo,path:".",profileRef:$ref,prNumbers:[$pr],profileMaintainer:$maintainer}]}' > integration.json
          node "$RUNNER_TEMP/ogk-kit/package/bin/openguildkit.mjs" gate --github --config integration.json \
            --state state --project "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --commit "$EXPECTED_HEAD" --run > proof/result.json
      - name: Archive the decision
        if: always() && steps.identity.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openguildkit-required-proof-${{ matrix.pr }}
          path: |
            proof/
            state/
      - name: Publish the required status
        if: always() && steps.identity.outcome == 'success'
        env:
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          STATUS_TOKEN: ${{ steps.status-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" |
            jq -e --arg base "$EXPECTED_BASE" --arg head "$EXPECTED_HEAD" '.state == "open" and .base.ref == $base and .head.sha == $head' >/dev/null
          state=failure
          if [[ "$GATE_OUTCOME" == success ]]; then state=success; fi
          description='OpenGuildKit check incomplete'
          if [[ -s proof/result.json ]]; then
            description=$(jq -r '.current.decision.effectiveStatus + " | rule " + .current.policyCommit' proof/result.json)
          fi
          # A scheduled run only adds a status when the verdict changed, which keeps under GitHub's status limit.
          latest=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_HEAD/status?per_page=100" |
            jq -c --arg context "$STATUS_CONTEXT" '[.[] | .statuses[]? | select(.context == $context)][0] // {} | [.state, .description]')
          if [[ "$latest" == "$(jq -cn --arg state "$state" --arg description "$description" '[$state, $description]')" ]]; then
            echo "Status unchanged: $state"
            exit 0
          fi
          GH_TOKEN="$STATUS_TOKEN" gh api "repos/$GITHUB_REPOSITORY/statuses/$EXPECTED_HEAD" -f context="$STATUS_CONTEXT" -f state="$state" \
            -f description="$description" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
