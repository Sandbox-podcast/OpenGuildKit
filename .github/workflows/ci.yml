name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e .

      - name: Validate the catalog
        run: openguildkit catalog --json

      - name: Validate the reference library
        run: openguildkit references

      - name: Validate the pattern library
        run: openguildkit patterns

      - name: Validate the brain catalog
        run: openguildkit brains

      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -v

      - name: Replay the request status example
        run: python examples/request-status/replay.py

  package:
    name: Build and install the wheel on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build
        run: |
          python -m pip install build
          python -m build

      - name: Install the wheel in a clean environment and set up a test project
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          if [ -x "$RUNNER_TEMP/wheel-env/bin/python" ]; then bin="$RUNNER_TEMP/wheel-env/bin"; else bin="$RUNNER_TEMP/wheel-env/Scripts"; fi
          "$bin/python" -m pip install dist/*.whl
          project="$RUNNER_TEMP/test-project"
          mkdir -p "$project"
          cd "$project"
          "$bin/openguildkit" --version
          "$bin/openguildkit" catalog > /dev/null
          "$bin/openguildkit" references --id conventional-commits > /dev/null
          "$bin/openguildkit" patterns > /dev/null
          printf '{"name": "Wheel check", "stack": ["Python"]}' > answers.json
          "$bin/openguildkit" init --answers answers.json
          "$bin/openguildkit" check
          "$bin/openguildkit" integrations --host claude-code
          test -f .claude/skills/openguildkit/SKILL.md
          test -f .claude/agents/guild-board.md

  ci-coordinator:
    name: CI coordinator on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: integrations/ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: npm pack --dry-run

  contribution-checks:
    name: contribution-checks
    if: ${{ always() }}
    needs: [test, package, ci-coordinator]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require the matrix and wheel checks to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          COORDINATOR_RESULT: ${{ needs.ci-coordinator.result }}
        run: |
          printf 'Tests: %s\nWheel: %s\nCI coordinator: %s\n' "$TEST_RESULT" "$PACKAGE_RESULT" "$COORDINATOR_RESULT"
          test "$TEST_RESULT" = success && test "$PACKAGE_RESULT" = success && test "$COORDINATOR_RESULT" = success
