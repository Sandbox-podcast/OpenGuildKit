name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Use a separate group for each pull request and each push to main.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.11 is the floor of requires-python; 3.15 is the version the maintainers work with (.python-version).
        python: ["3.11", "3.15"]
        # A pull request runs 4 of the 6 cells: both Pythons on Ubuntu, 3.15 on macOS and 3.11 on Windows, so each
        # system and each Python is tried; a push to main runs all six (#474).
        exclude: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"macos-latest","python":"3.11"},{"os":"windows-latest","python":"3.15"}]' || '[]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 2026-07-20 v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # 2026-10-22 v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e .

      - name: Validate the catalog
        # Its JSON is 12,000 lines: only a failure, through the exit code and standard error, is worth the log.
        shell: bash
        run: openguildkit catalog --json > /dev/null

      - name: Validate the reference library
        run: openguildkit references

      - name: Validate the pattern library
        run: openguildkit patterns

      - name: Validate the brain catalog
        run: openguildkit brains --check

      - name: Unit and end-to-end tests
        # One process per test file, several at once, and only the output of a failed file (#451). macOS runners
        # have three processors. `python -m unittest discover -s tests --durations 25` lists the slowest tests.
        run: python scripts/run_tests.py --jobs ${{ matrix.os == 'macos-latest' && 3 || 4 }}

      - name: Replay the request status example
        run: python examples/request-status/replay.py

  performance:
    name: CLI performance on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      OPENGUILDKIT_PERF: "1"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 2026-07-20 v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # 2026-10-22 v7.1.0
        with:
          python-version-file: .python-version
      # Time what the wheel ships: one catalog file instead of one file per record.
      - run: python scripts/build_catalog_bundle.py
      - run: python -m unittest tests.test_performance.PerformanceTests -v

  # The wheel, with the web interface inside, is built once, the way release.yml builds it; the package job installs
  # that wheel on each system (#474). The wheel holds Python files and the built interface, so the Python that
  # builds it does not change it.
  wheel:
    name: Build the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 2026-07-20 v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # 2026-10-22 v7.1.0
        with:
          python-version-file: .python-version

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # 2026-10-08 v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The same three steps as the build job of release.yml (tests/test_release.py compares them).
      - name: Build the web interface into the package
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run build
          npm run bundle

      - name: Build the wheel
        run: |
          python -m pip install build
          python scripts/build_catalog_bundle.py
          python -m build --wheel --outdir dist

      - name: Check that the wheel holds the web interface and the catalog bundle
        run: |
          python -m zipfile -l dist/openguildkit-*-py3-none-any.whl | grep -F openguildkit/web_dist/index.html
          python -m zipfile -l dist/openguildkit-*-py3-none-any.whl | grep -F openguildkit/registry/catalog.bundle.json

      # readme-renderer[md] renders the Markdown description as PyPI would.
      - name: Check the package metadata and its description
        run: |
          python -m pip install twine "readme-renderer[md]"
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # 2026-10-07 v7.0.2
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  package:
    name: Install the wheel with Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: wheel
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.15"]
        # Install the wheel once on macOS to limit use of hosted macOS runners.
        exclude:
          - os: macos-latest
            python: "3.11"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 2026-07-20 v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # 2026-10-22 v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # 2026-10-07 v8.0.2
        with:
          name: wheel
          path: dist

      # docs/install.md has teams install the wheel with pipx or uv: pipx on Windows, a fresh virtual
      # environment on Linux and macOS.
      - name: Install the wheel in a clean environment
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            python -m pip install pipx
            export PIPX_HOME="$RUNNER_TEMP/pipx" PIPX_BIN_DIR="$RUNNER_TEMP/pipx-bin"
            python -m pipx install dist/*.whl
            echo "OPENGUILDKIT=$PIPX_BIN_DIR/openguildkit" >> "$GITHUB_ENV"
          else
            python -m venv "$RUNNER_TEMP/wheel-env"
            "$RUNNER_TEMP/wheel-env/bin/python" -m pip install dist/*.whl
            echo "OPENGUILDKIT=$RUNNER_TEMP/wheel-env/bin/openguildkit" >> "$GITHUB_ENV"
          fi

      - name: Run the installed command and its web interface
        run: python .github/scripts/check-installed-cli.py -- "$OPENGUILDKIT"

      - name: Set up a test project with the installed command
        run: |
          project="$RUNNER_TEMP/test-project"
          mkdir -p "$project"
          cd "$project"
          "$OPENGUILDKIT" catalog > /dev/null
          "$OPENGUILDKIT" references --id conventional-commits > /dev/null
          "$OPENGUILDKIT" patterns > /dev/null
          printf '{"name": "Wheel check", "stack": ["Python"], "personal_data": "no"}' > answers.json
          "$OPENGUILDKIT" init --answers answers.json
          "$OPENGUILDKIT" check
          "$OPENGUILDKIT" integrations --host claude-code
          test -f .claude/skills/openguildkit/SKILL.md
          test -f .claude/skills/openguildkit/references/setup.md
          test -f .claude/agents/guild-board.md

  # What changed decides which of the three jobs below have anything to check (#474). The step reads the list of files
  # from Git, with no third-party action; when it cannot, every job runs. The patterns are what each job reads:
  # the checks of web/ also read the registry of the CLI and docs/glossary.md from outside it (tests/test_workflows.py
  # lists what they read).
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      coordinator: ${{ steps.filter.outputs.coordinator }}
      web: ${{ steps.filter.outputs.web }}
      journeys: ${{ steps.filter.outputs.journeys }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 2026-07-20 v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        name: List the changed files
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if changed=$(git diff --name-only "$BASE" HEAD 2>/dev/null) && [ -n "$changed" ]; then
            echo "$(printf '%s\n' "$changed" | wc -l | tr -d ' ') files changed since $BASE."
            all=false
          else
            echo "The changed files cannot be listed: every job runs."
            all=true
          fi
          show() { if [ "$all" = true ] || printf '%s\n' "$changed" | grep -Eq "$2"; then echo "$1=true"; else echo "$1=false"; fi; }
          {
            show coordinator '^(integrations/ci/|examples/export-expiry/|\.github/workflows/ci\.yml$)'
            show web '^(web/|src/openguildkit/registry/|docs/glossary\.md$|\.nvmrc$|\.github/workflows/ci\.yml$)'
            show journeys '^(web/|src/|\.python-version$|\.nvmrc$|\.github/workflows/ci\.yml$)'
          } | tee -a "$GITHUB_OUTPUT"

  ci-coordinator:
    name: CI coordinator on ${{ matrix.os }}
    needs: changes
    if: ${{ needs.changes.outputs.coordinator == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: integrations/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 2026-07-20 v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # 2026-10-08 v7.1.0
        with:
          # The floor of integrations/ci/package.json; the other jobs read the version of .nvmrc.
          node-version: "22"
      - run: npm test
      - run: npm pack --dry-run
      - name: Type-check the JavaScript, whose count of errors can only go down
        # tsc --checkJs on bin/, lib/ and pilot/ (jsconfig.json), with the TypeScript and Node types of web/. 59
        # errors on 28 November 2026, most of them in the option parsing of bin/openguildkit.mjs: lower the
        # ceiling with each fix (#531).
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          npm install --no-save --no-package-lock --ignore-scripts typescript@5.9.3 @types/node@24.19.2
          count=$(npx --no-install tsc -p jsconfig.json | grep -c 'error TS' || true)
          echo "tsc --checkJs: $count errors, ceiling 59"
          test "$count" -le 59

  web:
    name: Web app
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 2026-07-20 v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # 2026-10-08 v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:exports
      - run: npm run check:ratchet
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  # The journeys of the demo and of the project interface (openguildkit ui on sample projects), in the
  # Chrome the runner already has.
  web-e2e:
    name: Web journeys
    needs: changes
    if: ${{ needs.changes.outputs.journeys == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      PW_CHANNEL: chrome
      OGK_PYTHON: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 2026-07-20 v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # 2026-10-22 v7.1.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # 2026-10-08 v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Demo journeys
        run: npm run e2e
      - name: Project interface journeys
        run: npm run e2e:project
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # 2026-10-07 v7.0.2
        if: failure()
        with:
          name: playwright-results
          path: web/test-results
          retention-days: 7

  # ruff and mypy at the versions pinned in pyproject.toml, counted per rule against scripts/lint-baseline.json:
  # a count may go down and never up (docs/testing.md, "Lint and types").
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 2026-07-20 v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # 2026-10-22 v7.1.0
        with:
          python-version-file: .python-version
      - name: Install the pinned linter and type checker
        run: python -m pip install ruff==0.17.6 mypy==2.4.1
      - name: Compare the findings with the baseline
        run: python scripts/lint_ratchet.py

  # The conventions of docs/agents/conventions.md that a pull request can break. A push to main has no pull
  # request: its steps are skipped.
  conventions:
    name: Conventions for agents
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # issues: read lets check_fix_trace.py read the labels of the issues a pull request closes; pull-requests: read
    # lets the job read the title and body as they are now, so that a re-run after an edit checks the edited text.
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      BASE: origin/${{ github.base_ref }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 2026-07-20 v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # 2026-10-22 v7.1.0
        with:
          python-version-file: .python-version
      - name: Read the title and body as they are now
        if: github.event_name == 'pull_request'
        env:
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          delimiter="PR_TEXT_$(openssl rand -hex 16)"
          {
            echo "PR_TITLE<<$delimiter"; gh api "repos/$GH_REPO/pulls/$NUMBER" --jq .title; echo "$delimiter"
            echo "PR_BODY<<$delimiter"; gh api "repos/$GH_REPO/pulls/$NUMBER" --jq '.body // ""'; echo "$delimiter"
          } >> "$GITHUB_ENV"
      - name: Pull request text
        if: github.event_name == 'pull_request'
        run: python scripts/check_pr_text.py --base "$BASE"
      - name: A closed bug has its test and its ledger line
        if: github.event_name == 'pull_request'
        run: python scripts/check_fix_trace.py --base "$BASE"
      - name: Removed assertions are listed
        if: github.event_name == 'pull_request'
        run: python scripts/check_oracle.py --base "$BASE"

  contribution-checks:
    name: contribution-checks
    if: ${{ !cancelled() }}
    needs: [changes, test, performance, wheel, package, ci-coordinator, web, web-e2e, lint, conventions]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reads the jobs of this run, to tell a job that no runner picked up from a job that failed.
    permissions:
      actions: read
    steps:
      - name: Require all checks to pass
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          TEST_RESULT: ${{ needs.test.result }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
          WHEEL_RESULT: ${{ needs.wheel.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          COORDINATOR_RESULT: ${{ needs.ci-coordinator.result }}
          WEB_RESULT: ${{ needs.web.result }}
          WEB_E2E_RESULT: ${{ needs.web-e2e.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          CONVENTIONS_RESULT: ${{ needs.conventions.result }}
        run: |
          printf 'Changed files: %s\nTests: %s\nPerformance: %s\nWheel build: %s\nWheel install: %s\nCI coordinator: %s\nWeb: %s\nWeb journeys: %s\nLint: %s\nConventions: %s\n' "$CHANGES_RESULT" "$TEST_RESULT" "$PERFORMANCE_RESULT" "$WHEEL_RESULT" "$PACKAGE_RESULT" "$COORDINATOR_RESULT" "$WEB_RESULT" "$WEB_E2E_RESULT" "$LINT_RESULT" "$CONVENTIONS_RESULT"
          # The CI coordinator, the web checks and the web journeys are skipped when no file they read changed: that
          # counts as a pass, but only when the job that decided it succeeded.
          if test "$CHANGES_RESULT" = success && test "$TEST_RESULT" = success && test "$PERFORMANCE_RESULT" = success && test "$WHEEL_RESULT" = success && test "$PACKAGE_RESULT" = success && { test "$COORDINATOR_RESULT" = success || test "$COORDINATOR_RESULT" = skipped; } && { test "$WEB_RESULT" = success || test "$WEB_RESULT" = skipped; } && { test "$WEB_E2E_RESULT" = success || test "$WEB_E2E_RESULT" = skipped; } && test "$LINT_RESULT" = success && test "$CONVENTIONS_RESULT" = success; then
            exit 0
          fi
          # A job cancelled before any step ran never got a runner: GitHub gave up waiting for one. That says
          # nothing about the change, and rerunning the job is enough.
          never_started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "cancelled" and (.steps | length) == 0) | .name') || never_started=""
          if [ -n "$never_started" ]; then
            echo "These jobs never started: no runner picked them up, which is not a failure of the change."
            printf '  - %s\n' "$never_started"
            echo "Rerun them: Re-run jobs, then Re-run failed jobs, on the run page. contribution-checks runs again after them."
          fi
          echo "For any other job, open Details next to it to read the log, fix, and push again."
          exit 1
