name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e .

      - name: Validate the catalog
        run: openguildkit catalog --json

      - name: Validate the reference library
        run: openguildkit references

      - name: Validate the pattern library
        run: openguildkit patterns

      - name: Validate the brain catalog
        run: openguildkit brains

      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -v

      - name: Replay the request status example
        run: python examples/request-status/replay.py

  package:
    name: Build and install the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build
        run: |
          python -m pip install build
          python -m build

      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-env/bin/openguildkit catalog
          /tmp/wheel-env/bin/openguildkit references --id conventional-commits
          /tmp/wheel-env/bin/openguildkit patterns

  contribution-checks:
    name: contribution-checks
    if: ${{ always() }}
    needs: [test, package]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require the matrix and wheel checks to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          printf 'Tests: %s\nWheel: %s\n' "$TEST_RESULT" "$PACKAGE_RESULT"
          test "$TEST_RESULT" = success && test "$PACKAGE_RESULT" = success
