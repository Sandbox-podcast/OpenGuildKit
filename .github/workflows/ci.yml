name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Use a separate group for each pull request and each push to main.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.11 is the floor of requires-python; 3.15 is the version the maintainers work with.
        python: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e .

      - name: Validate the catalog
        run: openguildkit catalog --json

      - name: Validate the reference library
        run: openguildkit references

      - name: Validate the pattern library
        run: openguildkit patterns

      - name: Validate the brain catalog
        run: openguildkit brains --check

      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -v

      - name: Replay the request status example
        run: python examples/request-status/replay.py

  performance:
    name: CLI performance on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      OPENGUILDKIT_PERF: "1"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.15"
      - run: python -m unittest tests.test_performance.PerformanceTests -v

  package:
    name: Build and install the wheel with Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.15"]
        # Build one wheel on macOS to limit use of hosted macOS runners.
        exclude:
          - os: macos-latest
            python: "3.11"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The same three steps as the build job of release.yml (tests/test_release.py compares them).
      - name: Build the web interface into the package
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run build
          npm run bundle

      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist

      - name: Check that the wheel holds the web interface
        run: python -m zipfile -l dist/openguildkit-*-py3-none-any.whl | grep -F openguildkit/web_dist/index.html

      # Once is enough: the metadata does not depend on the system. readme-renderer[md] renders the Markdown
      # description as PyPI would.
      - name: Check the package metadata and its description
        if: runner.os == 'Linux' && matrix.python == '3.15'
        run: |
          python -m pip install twine "readme-renderer[md]"
          python -m twine check --strict dist/*

      # docs/install.md has teams install the wheel with pipx or uv: pipx on Windows, a fresh virtual
      # environment on Linux and macOS.
      - name: Install the wheel in a clean environment
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            python -m pip install pipx
            export PIPX_HOME="$RUNNER_TEMP/pipx" PIPX_BIN_DIR="$RUNNER_TEMP/pipx-bin"
            python -m pipx install dist/*.whl
            echo "OPENGUILDKIT=$PIPX_BIN_DIR/openguildkit" >> "$GITHUB_ENV"
          else
            python -m venv "$RUNNER_TEMP/wheel-env"
            "$RUNNER_TEMP/wheel-env/bin/python" -m pip install dist/*.whl
            echo "OPENGUILDKIT=$RUNNER_TEMP/wheel-env/bin/openguildkit" >> "$GITHUB_ENV"
          fi

      - name: Run the installed command and its web interface
        run: python .github/scripts/check-installed-cli.py -- "$OPENGUILDKIT"

      - name: Set up a test project with the installed command
        run: |
          project="$RUNNER_TEMP/test-project"
          mkdir -p "$project"
          cd "$project"
          "$OPENGUILDKIT" catalog > /dev/null
          "$OPENGUILDKIT" references --id conventional-commits > /dev/null
          "$OPENGUILDKIT" patterns > /dev/null
          printf '{"name": "Wheel check", "stack": ["Python"], "personal_data": "no"}' > answers.json
          "$OPENGUILDKIT" init --answers answers.json
          "$OPENGUILDKIT" check
          "$OPENGUILDKIT" integrations --host claude-code
          test -f .claude/skills/openguildkit/SKILL.md
          test -f .claude/skills/openguildkit/references/setup.md
          test -f .claude/agents/guild-board.md

  ci-coordinator:
    name: CI coordinator on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: integrations/ci
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm test
      - run: npm pack --dry-run

  web:
    name: Web app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:exports
      - run: npm run build

  # The journeys of the demo and of the project interface (openguildkit ui on sample projects), in the
  # Chrome the runner already has.
  web-e2e:
    name: Web journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      PW_CHANNEL: chrome
      OGK_PYTHON: python
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.15"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Demo journeys
        run: npm run e2e
      - name: Project interface journeys
        run: npm run e2e:project
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-results
          path: web/test-results
          retention-days: 7

  # The conventions of docs/agents/conventions.md that a pull request can break. A push to main has no pull
  # request: its steps are skipped.
  conventions:
    name: Conventions for agents
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # issues: read lets check_fix_trace.py read the labels of the issues a pull request closes.
    permissions:
      contents: read
      issues: read
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      BASE: origin/${{ github.base_ref }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.15"
      - name: Pull request text
        if: github.event_name == 'pull_request'
        run: python scripts/check_pr_text.py
      - name: A closed bug has its test and its ledger line
        if: github.event_name == 'pull_request'
        run: python scripts/check_fix_trace.py --base "$BASE"
      - name: Removed assertions are listed
        if: github.event_name == 'pull_request'
        run: python scripts/check_oracle.py --base "$BASE"

  contribution-checks:
    name: contribution-checks
    if: ${{ !cancelled() }}
    needs: [test, performance, package, ci-coordinator, web, web-e2e, conventions]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reads the jobs of this run, to tell a job that no runner picked up from a job that failed.
    permissions:
      actions: read
    steps:
      - name: Require all checks to pass
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_RESULT: ${{ needs.test.result }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          COORDINATOR_RESULT: ${{ needs.ci-coordinator.result }}
          WEB_RESULT: ${{ needs.web.result }}
          WEB_E2E_RESULT: ${{ needs.web-e2e.result }}
          CONVENTIONS_RESULT: ${{ needs.conventions.result }}
        run: |
          printf 'Tests: %s\nPerformance: %s\nWheel: %s\nCI coordinator: %s\nWeb: %s\nWeb journeys: %s\nConventions: %s\n' "$TEST_RESULT" "$PERFORMANCE_RESULT" "$PACKAGE_RESULT" "$COORDINATOR_RESULT" "$WEB_RESULT" "$WEB_E2E_RESULT" "$CONVENTIONS_RESULT"
          if test "$TEST_RESULT" = success && test "$PERFORMANCE_RESULT" = success && test "$PACKAGE_RESULT" = success && test "$COORDINATOR_RESULT" = success && test "$WEB_RESULT" = success && test "$WEB_E2E_RESULT" = success && test "$CONVENTIONS_RESULT" = success; then
            exit 0
          fi
          # A job cancelled before any step ran never got a runner: GitHub gave up waiting for one. That says
          # nothing about the change, and rerunning the job is enough.
          never_started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "cancelled" and (.steps | length) == 0) | .name') || never_started=""
          if [ -n "$never_started" ]; then
            echo "These jobs never started: no runner picked them up, which is not a failure of the change."
            printf '  - %s\n' "$never_started"
            echo "Rerun them: Re-run jobs, then Re-run failed jobs, on the run page. contribution-checks runs again after them."
          fi
          echo "For any other job, open Details next to it to read the log, fix, and push again."
          exit 1
