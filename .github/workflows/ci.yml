name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e .

      - name: Validate the catalog
        run: openguildkit catalog --json

      - name: Validate the reference library
        run: openguildkit references

      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -v

      - name: Replay the insurance example
        run: python examples/insurance-claims/replay.py

  package:
    name: Build and install the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build
        run: |
          python -m pip install build
          python -m build

      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-env/bin/openguildkit catalog
          /tmp/wheel-env/bin/openguildkit references --id conventional-commits
