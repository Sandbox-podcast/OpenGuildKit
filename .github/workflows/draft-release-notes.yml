name: Draft release notes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: draft-release-notes

jobs:
  draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Refresh the automated draft on GitHub
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          releases="/repos/$GH_REPO/releases"
          tag=openguildkit-next
          existing=$(gh api --paginate --slurp "$releases?per_page=100")

          if jq -e --arg tag "$tag" 'any(.[][]; .tag_name == $tag and (.draft | not))' <<< "$existing" >/dev/null; then
            printf 'Tag %s is already attached to a published release.\n' "$tag" >&2
            exit 1
          fi

          draft_id=$(jq -r --arg tag "$tag" '.[][] | select(.draft and .tag_name == $tag) | .id' <<< "$existing")
          if [[ -n "$draft_id" ]]; then
            method=PATCH
            endpoint="$releases/$draft_id"
          else
            method=POST
            endpoint="$releases"
          fi

          gh api --method POST "$releases/generate-notes" \
            -f tag_name="$tag" -f target_commitish=main -f configuration_file_path=.github/release.yml |
            jq --arg tag "$tag" '{tag_name: $tag, target_commitish: "main", name: "Next release (automated draft)", draft: true, body: .body}' |
            gh api --method "$method" "$endpoint" --input - --silent
