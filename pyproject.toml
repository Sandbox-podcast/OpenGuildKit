[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "openguildkit"
version = "0.16.1"
description = "Project rules and specialist reviews for AI-assisted work."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["coding-agents", "project-governance", "sdlc"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]

[project.scripts]
openguildkit = "openguildkit.cli:main"

[project.urls]
Repository = "https://github.com/Sandbox-podcast/OpenGuildKit"
Issues = "https://github.com/Sandbox-podcast/OpenGuildKit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openguildkit = ["registry/*/*.json"]
